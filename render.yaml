# V1.29 — configuración para publicar HAY en Render (render.com) con
# "New > Blueprint". Crea:
#   - el servidor web (hay-app)
#   - la base de datos PostgreSQL (hay-db), ya conectada por DATABASE_URL
#   - un disco de 1 GB para las fotos (mientras no se use un CDN S3/R2)
# Solo falta completar ADMIN_EMAIL en el panel. IDENTITY_KEY se genera sola.
services:
  - type: web
    name: hay-app
    runtime: node
    plan: starter
    buildCommand: echo "sin dependencias que instalar"
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: hay-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: IDENTITY_KEY
        generateValue: true
      # V1.35: correos (bienvenida y verificación completada). Completar en
      # el panel UNA de las opciones: RESEND_API_KEY, BREVO_API_KEY o SMTP_*.
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: PUBLIC_URL
        sync: false
      # V1.39: revisión de fotos en el servidor (sexo, violencia y PERSONAS en
      # las publicaciones). Sin esta clave solo queda la revisión del teléfono,
      # que no ve las caras muy de cerca. Ver PUBLICAR.md.
      - key: GOOGLE_VISION_KEY
        sync: false
    disk:
      name: hay-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: hay-db
    plan: basic-256mb
    databaseName: hay
    user: hay
